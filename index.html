<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1412">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Võ Lâm Idle</title>
<link rel="stylesheet" href="fonts/ibm-plex-mono.css">
<link rel="stylesheet" href="style.css?v=545">
<link rel="stylesheet" href="jx1ui.css?v=545">
<link rel="stylesheet" href="jx1ui2.css?v=545">
<link rel="stylesheet" href="ui20.css?v=545">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="lvbox"><span id="lv">1</span></div>
    <div class="topmid">
      <div class="row"><b id="heroName">Võ Lâm Idle</b><span id="stageLbl"></span></div>
    </div>
    <button id="ktcBtn" title="Kỳ Trân Các">Kỳ Trân Các</button>
    <div class="gold"><span class="coin"></span><span id="gold">0</span><img class="knbi" src="img/ep/knb.png" alt=""><span id="knbTop">0</span></div>
    <button id="actBtn" title="Nhiệm vụ · Hoạt động">⚔</button>
    <button id="giftBtn" title="Phần thưởng">🎁</button>
    <button id="compactBtn" title="Thu gọn / mở rộng sân đấu">⛶</button>
  </header>

  <section id="battle">
    <div id="bg"></div>
    <canvas id="arena"></canvas>
    <div id="hud">
      <div class="jxs"><span>Cấp</span><b id="lvS">1</b></div>
      <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
      <div class="bar mp"><i id="mpBar"></i><span id="mpTxt"></span></div>
      <div class="bar xp"><i id="xpBar"></i><span id="xpTxt"></span></div>
      <div class="jxs" title="Lực tay phải (sát thương chiêu chính)"><span>Lực tay</span><b id="pwS">0</b></div>
      <div id="mainSk"></div>
    </div>
    <div id="topCtl"><button id="rideBtn" class="chip"></button><button id="rotBtn" class="chip"></button><button id="ctrlBtn" class="chip"></button></div>
    <button id="inBtn" class="chip"></button>
    <div id="townBar" class="hidden"><b id="townName"></b><button class="btn sm" id="bShop">Cửa hàng</button><button class="btn sm" id="bKtcT">Kỳ Trân Các</button><button class="btn sm" id="bStashT">Kho chung</button><button class="btn sm" id="bSellTown">Bán đồ không khớp lọc</button><button class="btn sm on" id="bBack">Trở lại bãi</button></div>
    <div id="pad">
      <div class="hb">
        <button class="pbtn pot hp" id="bHp" title="Thuốc sinh lực (phím 1)"><i></i><div class="cd"></div><em></em><b>1</b><s class="pk">▾</s></button>
        <button class="pbtn pot mp" id="bMp" title="Thuốc nội lực (phím 2)"><i></i><div class="cd"></div><em></em><b>2</b><s class="pk">▾</s></button>
        <button class="pbtn pot tp" id="bTp" title="Thổ Địa Phù (phím 3)"><i></i><div class="cd"></div><b>3</b></button>
      </div>
      <div class="hb"><button class="pbtn mn" id="bMain"><i></i></button></div>
      <div class="hb">
        <button class="pbtn sk" data-i="0" title=""><i></i><b>F1</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="1" title=""><i></i><b>F2</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="2" title=""><i></i><b>F3</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="3" title=""><i></i><b>F4</b><s class="pk">▾</s></button>
      </div>
    </div>
  </section>

  <main id="panel">
    <div class="tab" id="t-log"></div>
    <div class="tab hidden" id="t-char"></div>
    <div class="tab hidden" id="t-skill"></div>
    <div class="tab hidden" id="t-inv"></div>
    <div class="tab hidden" id="t-forge"></div>
    <div class="tab hidden" id="t-quest"></div>
    <div class="tab hidden" id="t-more"></div>
  </main>

  <nav id="tabs">
    <button data-t="log" class="on">Giang hồ</button>
    <button data-t="char">Nhân vật<em class="dot" id="dotChar"></em></button>
    <button data-t="inv">Hành trang</button>
    <button data-t="skill">Võ công<em class="dot" id="dotSkill"></em></button>
    <button data-t="forge">Lò rèn<em class="dot" id="dotForge"></em></button>
    <button data-t="quest">Nhiệm vụ<em class="dot" id="dotQuest"></em></button>
    <button id="tabRide" class="tride tteam">Tổ đội</button>
    <button data-t="more">Hệ thống</button>
  </nav>

  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mbox" tabindex="-1"><button class="mx" id="mClose">✕</button><div id="mBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<div id="mpPanel" style="position:fixed;right:16px;top:72px;z-index:9999;width:270px;background:rgba(9,16,18,0.95);border:1px solid rgba(255,215,106,0.35);border-radius:10px;padding:10px;color:#fff;font:12px/1.4 sans-serif;box-shadow:0 12px 28px rgba(0,0,0,0.55);backdrop-filter:blur(6px);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:6px;">
    <div style="font-weight:700;color:#ffd76a;display:flex;align-items:center;gap:6px;">
      <span>⚔️ Giang Hồ Online</span>
      <span id="mpBadge" style="font-size:10px;background:#2d7a46;color:#fff;padding:1px 6px;border-radius:10px;">1 online</span>
    </div>
    <button id="mpToggle" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:15px;padding:0 4px;font-weight:bold;" title="Thu gọn / Mở rộng">−</button>
  </div>
  <div id="mpContent">
    <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
      <span style="color:#aaa;font-size:11px;">Tên:</span>
      <input id="mpName" type="text" value="" placeholder="Tên nhân vật" style="flex:1;box-sizing:border-box;padding:4px 8px;border-radius:5px;border:1px solid #3e4a4c;background:#0d171b;color:#ffd76a;font-size:12px;font-weight:700;" />
    </div>
    <div id="mpStatus" style="color:#a8f0bf;font-size:11px;min-height:16px;margin-bottom:6px;">Đang kết nối máy chủ...</div>
    <div id="mpBossBox" style="margin-bottom:8px;padding:6px 8px;border-radius:6px;background:rgba(255,184,75,0.08);border:1px solid rgba(255,184,75,0.4);font-size:11px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><strong id="mpBossName" style="color:#ffb84b;">Boss Thế Giới</strong><span id="mpBossHpTxt" style="color:#ffd76a;">100%</span></div>
      <div style="background:#222;height:6px;border-radius:3px;overflow:hidden;margin-bottom:6px;"><div id="mpBossBar" style="background:linear-gradient(90deg,#ff4757,#ffa502);height:100%;width:100%;transition:width .2s;"></div></div>
      <div style="display:flex;gap:6px;">
        <button id="mpBossAttack" style="flex:1;padding:5px 6px;border:none;border-radius:5px;background:#ff9f43;color:#121212;font-weight:700;font-size:11px;cursor:pointer;">Đánh Boss</button>
        <button id="mpPvpAttack" style="flex:1;padding:5px 6px;border:none;border-radius:5px;background:#d95f5f;color:#fff;font-weight:700;font-size:11px;cursor:pointer;">Tỷ thí PvP</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:11px;color:#d9f5d6;margin-bottom:4px;">
      <span>Hiệp khách trong Server</span>
    </div>
    <ul id="mpPlayers" style="margin:0 0 8px;padding-left:14px;max-height:110px;overflow-y:auto;color:#d9f5d6;font-size:11px;"></ul>
    <div style="font-weight:700;font-size:11px;color:#85c1e9;margin-bottom:4px;">Kênh Chat Thế Giới</div>
    <ul id="mpChat" style="margin:0 0 6px;padding-left:14px;max-height:90px;overflow-y:auto;color:#dfe9ef;font-size:11px;background:rgba(0,0,0,0.25);border-radius:4px;padding:4px 6px 4px 18px;"></ul>
    <div style="display:flex;gap:6px;">
      <input id="mpChatInput" type="text" placeholder="Nhắn tin toàn server..." style="flex:1;padding:5px 8px;border-radius:5px;border:1px solid #3e4a4c;background:#0d171b;color:#fff;font-size:11px;" />
      <button id="mpChatSend" style="padding:5px 10px;border:none;border-radius:5px;background:#3498db;color:#fff;cursor:pointer;font-size:11px;font-weight:700;">Gửi</button>
    </div>
  </div>
</div>
<script src="data.js?v=545"></script>
<script src="setvi.js?v=545"></script>
<script src="app.js?v=545"></script>
<script src="/multiplayer.js"></script>

</html>
